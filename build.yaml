builders:
  boilerplate_gen:
    import: 'tool/boilerplate_gen.dart'
    builder_factories: ['boilerplateBuilder']
    build_extensions:
      '.dart': ['.bp.dart']
    auto_apply: all_packages
    build_to: source
    defaults:
      generate_for:
        exclude:
          - '**/gen/*.bp.dart'

global_options:
  biscuit_dart|boilerplate_gen:
    options:
      build_extensions:
        '^lib/{{path}}/{{file}}.dart': ['lib/{{path}}/gen/{{file}}.bp.dart']
        '^lib/{{file}}.dart': ['lib/gen/{{file}}.bp.dart']
